<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Скидки Маркета | Выгодные покупки</title>
    <meta name="description" content="Скидки на Яндекс Маркет до 70%. Тематические подборки товаров с высоким рейтингом.">
    
    <!-- VK Open API -->
    <script src="https://vk.com/js/api/openapi.js?169"></script>
    
    <!-- VK Bridge (обязательно для Mini App) -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">💰</span>
                    <span class="logo-text">Скидки Маркета</span>
                </div>
                <p class="tagline">Выгодные покупки на Яндекс Маркете</p>
                <div id="categoryBadge" class="category-badge">
                    🔥 ГОРЯЧИЕ СКИДКИ 🔥
                </div>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main">
            <div id="discountsContainer">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>🔍 Ищем лучшие предложения...</p>
                </div>
            </div>
        </main>

        <!-- Нижнее меню -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="discounts">
                <span class="nav-icon">🔥</span>
                <span>Скидки</span>
            </button>
            <button class="nav-btn" data-tab="subscribe">
                <span class="nav-icon">🔔</span>
                <span>Подписка</span>
            </button>
            <button class="nav-btn" data-tab="info">
                <span class="nav-icon">ℹ️</span>
                <span>О нас</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
